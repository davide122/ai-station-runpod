name: Build and publish AI Station
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - station.sh
      - run-station.sh
      - .github/workflows/docker.yml
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space before Docker build
        run: |
          echo "Before cleanup:"
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/share/powershell /usr/local/.ghcup /usr/share/swift
          sudo apt-get clean
          docker system prune -af || true
          echo "After cleanup:"
          df -h /
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ghcr.io/davide122/ai-station-runpod:latest
