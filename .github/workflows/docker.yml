name: Build and publish AI Station
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - station.sh
      - run-station.sh
      - .github/workflows/docker.yml
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ghcr.io/davide122/ai-station-runpod:latest
